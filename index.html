<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKS Infra Projects</title>
<meta name="description" content="SKS Infra Projects. Our new website is coming soon.">
<meta name="theme-color" content="#0b1724">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1724'/%3E%3Crect x='12' y='29' width='16' height='6' rx='3' fill='%23f2a900'/%3E%3Crect x='36' y='29' width='16' height='6' rx='3' fill='%23f2a900'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b1724;
    --bg-glow: #13304a;
    --grid: rgba(255, 255, 255, 0.04);
    --text: #f3f6f9;
    --muted: #9fb0c0;
    --accent: #f2a900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 40%, var(--bg-glow) 0%, transparent 60%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    background-position: center;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 20px;
  }
  .eyebrow {
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(2.4rem, 7.5vw, 4.75rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-wrap: balance;
  }
  .road {
    width: 130px;
    height: 5px;
    margin: 30px auto;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 28px);
  }
  .lead {
    font-size: clamp(1.1rem, 2.6vw, 1.4rem);
    max-width: 30ch;
    line-height: 1.5;
  }
  .sub {
    color: var(--muted);
    margin-top: 10px;
    font-size: 1rem;
  }
  footer {
    text-align: center;
    padding: 24px 20px 28px;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Coming soon</p>
    <h1>SKS Infra Projects</h1>
    <div class="road" aria-hidden="true"></div>
    <p class="lead">Our new website is under construction.</p>
    <p class="sub">Please check back soon.</p>
  </main>
  <footer>&copy; 2026 SKS Infra Projects</footer>
</body>
</html>
